[project]
name = "peru-budget-lakehouse"
version = "0.1.0"
description = "Peru National Budget Execution Intelligence — Lakehouse Analytics Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "connectorx>=0.4.5",
    "dotenv>=0.9.9",
    "duckdb>=1.5.2",
    "groq>=0.22.0",
    "memory-profiler>=0.61.0",
    "plotly>=6.7.0",
    "polars>=1.40.1",
    "polars-hash>=0.6.0",
    "prefect>=3.7.2",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "sqlparse>=0.5.0",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "notebook>=7.5.6",
    "pytest>=9.0.3",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.ruff]
target-version = "py311"
exclude = [
    "notebooks/",
    ".venv/",
    "__pycache__/",
    ".pytest_cache/",
    "data/",
    "reports/",
    ".aider.*",
    ".ruff_cache/",
]

[tool.ruff.lint]
select = ["F", "E", "W"]
ignore = ["E501"]
