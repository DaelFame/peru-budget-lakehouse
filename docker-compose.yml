version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mef_lakehouse_dashboard
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "8501:8501"

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mef_lakehouse_pipeline
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: uv run python main.py